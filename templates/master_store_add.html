{# =========================================================
  店舗追加ページ（管理者）
  - 必要な入力項目はプロジェクトに合わせて増減OK
========================================================= #}
{% extends "base.html" %}

{% block title %}店舗追加{% endblock %}

{% block content %}
<section class="mx-auto max-w-3xl px-4 py-8">
  <header class="flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
    <div>
      <h1 class="text-2xl font-bold tracking-tight">店舗追加</h1>
      <p class="mt-1 text-sm text-slate-600">新しい店舗アカウントを登録します</p>
    </div>
    <a
      href="{{ url_for('store_list') }}"
      class="inline-flex items-center justify-center rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-800 hover:bg-slate-50"
    >
      一覧へ戻る
    </a>
  </header>

  <div class="mt-6 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
    <form method="post" class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <div class="sm:col-span-2">
        <label for="name" class="block text-sm font-medium text-slate-700">店舗名</label>
        <input
          id="store_name"
          name="store_name"
          required
          class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-200"
          placeholder="例）〇〇カフェ"
        />
      </div>

      <div>
        <label for="login_id" class="block text-sm font-medium text-slate-700">ログインID</label>
        <input
          id="login_id"
          name="login_id"
          class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-200"
          placeholder="例）store_bbbb"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-700">ログイン用パスワード</label>
        <input
          id="password"
          name="password"
          type="text"
          required
          class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-200"
          placeholder="半角英数字"
        />
      </div>

      <div class="sm:col-span-2">
        <label for="store_url" class="block text-sm font-medium text-slate-700">URL</label>
        <input
          id="store_url"
          name="store_url"
          type="url"
          required
          class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm outline-none focus:border-slate-400 focus:ring-2 focus:ring-slate-200"
        />
      </div>

      <div class="sm:col-span-2 flex flex-col gap-2 sm:flex-row sm:justify-end">
        <a
          href="{{ url_for('store_list') }}"
          class="inline-flex items-center justify-center rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-800 hover:bg-slate-50"
        >
          キャンセル
        </a>
        <button
          type="submit"
          class="inline-flex items-center justify-center rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-800"
        >
          追加する
        </button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
